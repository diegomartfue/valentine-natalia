<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365 días de nosotros</title>
    <meta name="description" content="Celebrando nuestro primer aniversario juntos">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💕</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <button class="music-btn music-btn--hidden" id="musicToggle" aria-label="Reproducir música">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
    </button>
    <audio id="bgMusic" loop preload="none"></audio>

    <nav class="nav" id="mainNav">
        <div class="nav__inner">
            <a href="#recuerdos" class="nav__link" data-section="recuerdos">Recuerdos</a>
            <span class="nav__dot" aria-hidden="true">&middot;</span>
            <a href="#razones" class="nav__link" data-section="razones">Razones</a>
            <span class="nav__dot" aria-hidden="true">&middot;</span>
            <a href="#carta" class="nav__link" data-section="carta">Carta</a>
        </div>
    </nav>

    <section class="welcome" id="bienvenida">
        <div class="welcome__particles" id="particles" aria-hidden="true"></div>
        <div class="welcome__content">
            <p class="welcome__date" id="welcomeDate"></p>
            <h1 class="welcome__title" id="welcomeTitle"></h1>
            <div class="welcome__divider" aria-hidden="true"></div>
            <p class="welcome__subtitle" id="welcomeSubtitle"></p>
            <button class="welcome__btn" id="startBtn" type="button"></button>
        </div>
    </section>

    <section class="section section--cream" id="recuerdos">
        <div class="section__inner">
            <div class="section__header reveal">
                <h2 class="section__title">Un año de recuerdos</h2>
                <p class="section__subtitle">Nuestros momentos favoritos juntos</p>
            </div>
            <div class="gallery" id="gallery"></div>
        </div>
    </section>

    <section class="section section--blush" id="razones">
        <div class="section__inner">
            <div class="section__header reveal">
                <h2 class="section__title">Pequeñas razones por las que te amo</h2>
            </div>
            <div class="reasons-toolbar reveal">
                <span class="reasons-counter" id="reasonsCounter"></span>
                <button class="btn btn--outline" id="surpriseBtn" type="button">&#10022; Sorpréndeme</button>
            </div>
            <div id="reasonsContainer"></div>
        </div>
    </section>

    <section class="section section--cream" id="carta">
        <div class="section__inner">
            <div class="section__header reveal">
                <h2 class="section__title" id="letterSectionTitle"></h2>
            </div>
            <div class="letter-stage" id="letterStage"></div>
            <p class="letter-closing-msg hidden" id="closingMsg"></p>
        </div>
    </section>

    <footer class="footer">
        <p>Hecho con amor para ti &#9829;</p>
    </footer>

    <div class="modal" id="modal" aria-hidden="true" role="dialog">
        <div class="modal__backdrop" id="modalBackdrop"></div>
        <div class="modal__card" id="modalCard">
            <button class="modal__close" id="modalClose" aria-label="Cerrar" type="button">&times;</button>
            <div class="modal__body" id="modalBody"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
